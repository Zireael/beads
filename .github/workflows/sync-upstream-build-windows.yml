name: Sync Upstream & Build Windows

# Sync one of this fork's branches with gastownhall/beads and compile an
# UNSIGNED bd.exe.
#
# Unsigned is the permanent, deliberate choice for this path:
#   * `go build` emits an unsigned PE. Nothing here runs goreleaser,
#     osslsigncode, signtool or scripts/sign-windows.sh, so there is no
#     signing hook to satisfy.
#   * It needs no WINDOWS_SIGNING_CERT_PFX_BASE64 / WINDOWS_SIGNING_CERT_PASSWORD
#     secrets, so a sync can never block on a certificate that only exists for
#     a real release.
#   * The `Assert the binary is unsigned` step enforces it: the run fails if a
#     signature ever appears, so this cannot quietly change later. Signing
#     stays in gastownhall/beads' release.yml, which is guard-skipped in forks.
#
# Repeatable: every future sync is one dispatch of this workflow. `ref` picks
# the branch to merge upstream into and build; `upstream_ref` picks what to
# merge in.
#
# Pushing is OPT-IN. By default the run merges upstream into the runner's
# checkout and builds that, leaving the branch on the remote alone, so a build
# can never move a PR head, restart its CI or stale its review. Set `push` to
# true when you do want the merge written back.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Fork branch to sync and build'
        required: true
        default: 'main'
      upstream_ref:
        description: 'Upstream branch to merge in'
        required: true
        default: 'main'
      push:
        description: 'Push the merge back to ref (moves the PR head, restarts CI)'
        type: boolean
        required: false
        default: false
      version:
        description: 'Version string stamped into the binary'
        required: false
        default: 'dev'
      smoke_test:
        description: 'Run a version/help smoke test against bd.exe'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: sync-upstream-build-windows-${{ inputs.ref }}
  cancel-in-progress: false

env:
  BD_DISABLE_METRICS: "1"
  BD_DISABLE_EVENT_FLUSH: "1"

jobs:
  sync-and-build:
    name: Sync ${{ inputs.ref }} and build bd.exe (unsigned)${{ inputs.push && '' || ' - no push' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "Sync Bot"
          git config --global user.email "sync@zireael.github"

      - name: Sync from upstream
        id: sync
        # The merge always happens in this checkout, so the artifact is built
        # from synced source either way. Only the push is gated: without it the
        # branch on the remote is exactly as it was when the run started, which
        # means the built commit can exist nowhere but this runner. That case is
        # warned about, named in the artifact, and recorded in the summary, so
        # the artifact is never mistaken for a branch build.
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/gastownhall/beads.git 2>/dev/null || true
          git fetch upstream "${{ inputs.upstream_ref }}"

          # The branch head as the remote has it right now. Empty when `ref` is
          # not a branch (tag or SHA), where the comparison is meaningless.
          branch_head=""
          if git fetch --quiet origin "+refs/heads/${{ inputs.ref }}:refs/remotes/origin/${{ inputs.ref }}"; then
            branch_head=$(git rev-parse "refs/remotes/origin/${{ inputs.ref }}")
          fi

          git merge "upstream/${{ inputs.upstream_ref }}" --no-edit
          built=$(git rev-parse HEAD)
          built_short=$(git rev-parse --short HEAD)

          off_branch=false
          if [ -n "$branch_head" ] && [ "$built" != "$branch_head" ]; then
            off_branch=true
          fi
          if [ "${{ inputs.push }}" = "true" ] || [ "$off_branch" = false ]; then
            is_branch_build=yes
          else
            is_branch_build=no
          fi

          {
            echo "built=$built"
            echo "built_short=$built_short"
            echo "branch_head=$branch_head"
            echo "off_branch=$off_branch"
            echo "is_branch_build=$is_branch_build"
          } >> "$GITHUB_OUTPUT"

          echo "Built commit: $built"
          echo "Branch head:  ${branch_head:-<unknown: ${{ inputs.ref }} is not a branch>}"

          if [ "${{ inputs.push }}" = "true" ]; then
            git push origin "HEAD:refs/heads/${{ inputs.ref }}"
            echo "::notice::Pushed the merge to ${{ inputs.ref }}; its CI will restart."
          elif [ "$off_branch" = true ]; then
            echo "::warning::Built ${built_short}, which is NOT on ${{ inputs.ref }} (branch head is $(git rev-parse --short "$branch_head")). push is off, so this is a local-only merge: the artifact is not a branch build."
          else
            echo "::notice::push is off: built the merge locally, ${{ inputs.ref }} on the remote is untouched."
          fi

          {
            echo "### Sync"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| target branch | \`${{ inputs.ref }}\` |"
            echo "| upstream | \`${{ inputs.upstream_ref }}\` |"
            echo "| branch head (remote) | \`${branch_head:-unknown}\` |"
            echo "| **built commit** | **\`$built\`** |"
            echo "| pushed | ${{ inputs.push }} |"
            echo "| artifact is a branch build | **$is_branch_build** |"
            echo ""
            if [ "$is_branch_build" = no ]; then
              echo "> **Warning:** this build is a local-only merge. \`${built_short}\` does not exist on \`${{ inputs.ref }}\` (which is at \`${branch_head:0:9}\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        # cache: true matches build-windows.yml so both jobs share the module
        # and build caches. Measured: it does not change the bytes either way
        # (two sync runs, one without it, hashed identically), so it is here
        # for build speed and flag parity, not for reproducibility.
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Require a C toolchain
        # Same rule as build-windows.yml: refuse to fall back to CGO_ENABLED=0,
        # because that binary builds fine and then cannot open a database.
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gcc >/dev/null 2>&1; then
            echo "::error::gcc not found; refusing to produce a non-CGO binary."
            exit 1
          fi
          gcc --version | head -1

      - name: Stamp build info
        # Identical stamps to build-windows.yml, derived the same way, so the
        # two workflows build the same commit into the same binary.
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Windows binary (unsigned)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # Flags, tags and stamps match build-windows.yml exactly: -s -w strips
          # the symbol table and DWARF (the CGO check reads go's build info and
          # the signature check reads the PE, both of which survive stripping),
          # and the -X stamps are what make the two artifacts comparable.
          go build -v -tags "gms_pure_go netgo" \
            -ldflags "-s -w -X main.Version=${{ inputs.version || 'dev' }} -X main.Build=${{ steps.meta.outputs.short }} -X main.Commit=${{ steps.meta.outputs.commit }} -X main.Branch=${{ steps.meta.outputs.branch }}" \
            -o bd.exe ./cmd/bd
          ls -la bd.exe

      - name: Assert the binary is unsigned
        # The enforcement half of the policy above: an unsigned PE is the
        # contract of this workflow, so a signature showing up is a failure,
        # not a bonus.
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature .\bd.exe
          Write-Host "Authenticode status: $($sig.Status)"
          if ($sig.Status -ne 'NotSigned') {
            throw "bd.exe is signed ($($sig.Status)); this workflow builds unsigned binaries only."
          }

      - name: Verify CGO was linked in
        shell: bash
        run: |
          set -euo pipefail
          go version -m bd.exe | sed -n '/build\s/p' || true
          if ! go version -m bd.exe | grep -qE '^\s+build\s+CGO_ENABLED=1$'; then
            echo "::error::bd.exe was not linked with CGO_ENABLED=1; the embedded Dolt store would be missing."
            exit 1
          fi

      - name: Smoke test
        if: ${{ inputs.smoke_test }}
        shell: bash
        run: |
          set -euo pipefail
          ./bd.exe version
          ./bd.exe help

      - name: Upload bd.exe
        uses: actions/upload-artifact@v4
        with:
          # The `-unpushed-<sha>` suffix is how a local-only merge announces
          # itself in the artifact list; a branch build keeps the plain name.
          name: bd-windows-amd64-${{ inputs.ref }}${{ steps.sync.outputs.is_branch_build == 'no' && format('-unpushed-{0}', steps.sync.outputs.built_short) || '' }}
          path: bd.exe
          retention-days: 2
